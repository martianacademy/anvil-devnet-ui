# Single-origin front door: one hostname for the explorer, the Blockscout API and
# the JSON-RPC endpoint, so a browser, a wallet and a tunnel need one address
# between them.
#
# Kept apart from devnet-stack.yml because it applies to both paths. With
# --docker the explorer and the control API are containers; without it they are
# host processes, and the two variables below are what point at them.
services:
  # Blockscout's own nginx sends "/" to whatever FRONT_PROXY_PASS names. Pointing
  # it at this fork is what puts the explorer and the /devnet pages on the same
  # origin as /api/v2, instead of on their own port.
  proxy:
    environment:
      FRONT_PROXY_PASS: "${DEVNET_FRONT_PROXY_PASS:-http://devnet-ui:3000}"

  devnet-proxy:
    image: nginx:alpine
    container_name: devnet-proxy
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - "${DEVNET_PROXY_PORT:-8000}:80"
    environment:
      STACK_PROXY_PASS: http://proxy:80
      # The control API screens out state-changing RPC methods when it runs
      # read-only; point this at the node itself for raw Anvil instead.
      RPC_PROXY_PASS: "${DEVNET_RPC_PROXY_PASS:-http://devnet-api:3010/api/rpc}"
    volumes:
      - "${DEVNET_REPO_DIR}/stack/docker-compose/proxy:/etc/nginx/templates:ro"
